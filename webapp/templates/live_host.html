{% extends "base.html" %}
{% block title %}Ведущий Live — Smart ENT{% endblock %}
{% block content %}
<div class="live-host">
  <h1>🎮 {{ test_title }}</h1>
  <div id="host-root"><p class="muted">Загрузка…</p></div>
</div>

<script>
const CODE = "{{ code }}";
const JOIN_URL = location.origin + '/live/' + CODE;
let lastStatus = null, timerRAF=null, deadline=null;
const root = document.getElementById('host-root');
const COLORS=['a','b','c','d'], SYM=['▲','◆','●','■'];
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}

async function act(a, body){ try{ await fetch(`/api/live/${CODE}/host/${a}`,{method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})}); poll(); }catch(_){}}

async function poll(){
  try{
    const r=await fetch(`/api/live/${CODE}/host/state`); const d=await r.json();
    render(d);
  }catch(_){}
}

function playersBlock(d){
  return `<div class="host-players">
    <b>Игроки: ${d.player_count} (онлайн ${d.online})</b>
    <div class="host-plist">${d.players.map(p=>`
      <span class="host-pchip ${p.online?'':'off'}">${esc(p.name)} · ${p.score}б
      <button class="host-kick" onclick="act('kick',{tg_id:${p.tg_id}})" title="исключить">✕</button></span>`).join('')}</div>
  </div>`;
}

function render(d){
  if(d.error){ root.innerHTML='<p>Нет доступа</p>'; return; }
  if(d.status==='lobby'){
    root.innerHTML = `
      <section class="host-lobby">
        <div class="host-code">Код: <b>${CODE}</b></div>
        <div class="host-join">Ссылка: <a href="${JOIN_URL}">${JOIN_URL}</a></div>
        <img class="host-qr" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(JOIN_URL)}">
        ${settingsBlock(d)}
        ${playersBlock(d)}
        <button class="btn btn-primary host-big" onclick="act('start')">▶️ Начать тест</button>
      </section>`;
    return;
  }
  if(d.status==='question'){
    if(lastStatus!=='q'+d.q_num){ lastStatus='q'+d.q_num; startTimer(d); }
    root.innerHTML = `
      <div class="host-qhead"><span>Вопрос ${d.q_num}/${d.q_total}</span>
        <span class="host-timer" id="host-tsec"></span></div>
      <div class="host-qtext">${esc(d.question_text)}</div>
      <div class="host-answered">Ответили: <b>${d.answered_count}</b> из ${d.player_count}</div>
      <div class="host-counts">${(d.live_counts||[]).map((o,i)=>`
        <div class="host-count live-${COLORS[i%4]}"><span class="live-sym">${SYM[i%4]}</span> ${o.count}</div>`).join('')}</div>
      <div class="host-controls">
        <button class="btn btn-primary" onclick="act('skip')">⏭ Завершить вопрос (Skip)</button>
        <button class="btn" onclick="act('finish')">⏹ Завершить тест</button>
      </div>
      ${leaderboardMini(d)}`;
    return;
  }
  if(d.status==='stats'){
    lastStatus='stats'+d.q_num;
    const s=d.stats||{options:[]};
    root.innerHTML = `
      <div class="host-qhead"><span>Итог вопроса ${d.q_num}/${d.q_total}</span></div>
      <div class="host-qtext">${esc(d.question_text)}</div>
      <div class="live-statlist">${s.options.map((o,i)=>`
        <div class="live-statrow live-${COLORS[i%4]} ${o.is_correct?'correct':''}">
          <span class="live-sym">${SYM[i%4]}</span>
          <span class="live-stattext">${esc(o.text)} ${o.is_correct?'✔':''}</span>
          <span class="live-statpct">${o.percent}% · ${o.count}</span>
          <div class="live-statfill" style="width:${o.percent}%"></div>
        </div>`).join('')}</div>
      <p class="muted">Не ответили: ${s.not_answered} · Ответили: ${s.answered}/${s.total_players}</p>
      <div class="host-controls">
        <button class="btn btn-primary host-big" onclick="act('next')">${d.q_num>=d.q_total?'🏁 Показать итоги':'➡️ Следующий вопрос'}</button>
      </div>
      ${leaderboardMini(d)}`;
    return;
  }
  if(d.status==='finished'){
    const pod=d.podium||[]; const medal=['🥇','🥈','🥉','🏅','🏅'];
    root.innerHTML = `<h2>🏆 Итоги</h2>
      <div class="live-podium">${pod.map((p,i)=>`
        <div class="live-pod live-pod-${i+1}"><div class="live-pod-medal">${medal[i]}</div>
        <div class="live-pod-name">${esc(p.name)}</div><div class="live-pod-score">${p.score} б.</div></div>`).join('')}</div>
      <a class="btn btn-primary" href="/admin/live">Новый Live-тест</a>`;
    return;
  }
}

function settingsBlock(d){
  return `<details class="host-settings"><summary>⚙️ Настройки</summary>
    <label>Режим:
      <select onchange="act('settings',{mode:this.value})">
        <option value="competitive" ${d.mode==='competitive'?'selected':''}>Соревновательный (баллы за скорость)</option>
        <option value="study" ${d.mode==='study'?'selected':''}>Учебный (1 балл за верный)</option>
      </select></label>
    <label>Время на вопрос, сек:
      <input type="number" min="5" max="300" value="20" onchange="act('settings',{time_per_question:parseInt(this.value)})"></label>
    <label>Рейтинг:
      <select onchange="act('settings',{rating_visibility:this.value})">
        <option value="full">Полный</option><option value="top5">Только топ-5</option>
        <option value="self">Только своё место</option><option value="hidden">Скрыть до конца</option>
      </select></label>
    <button class="btn-small" onclick="act('lock')">${d.locked?'🔓 Разрешить вход':'🔒 Заблокировать вход'}</button>
  </details>`;
}
function leaderboardMini(d){
  return `<details class="host-lb"><summary>📊 Рейтинг (${d.player_count})</summary>
    <ol class="host-lb-list">${d.players.slice(0,10).map(p=>`<li>${esc(p.name)} — <b>${p.score}</b> (${p.correct}✔)</li>`).join('')}</ol>
  </details>`;
}
function startTimer(d){
  deadline=Date.now()+(d.remaining||d.time_total||20)*1000;
  function tick(){ const left=Math.max(0,deadline-Date.now());
    const s=document.getElementById('host-tsec'); if(s) s.textContent=Math.ceil(left/1000)+'с';
    if(left>0) timerRAF=requestAnimationFrame(tick);}
  cancelAnimationFrame(timerRAF); tick();
}
poll(); setInterval(poll, 1200);
</script>
{% endblock %}
