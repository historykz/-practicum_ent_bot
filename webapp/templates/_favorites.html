{# ⭐️ Избранное: кнопка-звезда у вопроса. Подключается в тест, карточки и
   заучивание. Состояние хранится на сервере (user_id + question_id), поэтому
   сохраняется после выхода, закрытия приложения и нового входа. #}
<style>
  .fav-row { display: flex; justify-content: flex-end; margin: -4px 0 8px; }
  .fav-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: .86rem; font-weight: 600; line-height: 1.2; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .fav-btn.is-on { border-color: #f5a623; color: #b97700; background: rgba(245,166,35,.12); }
  .fav-btn:active { transform: scale(.95); }
  .fav-btn[disabled] { opacity: .6; }
  /* ⭐️ Звезда урока в списке раздела: маленькая, в правом верхнем углу строки */
  li.lesson-row.has-lfav { position: relative; }
  li.lesson-row.has-lfav .lesson-row-body { padding-right: 58px; }
  .fav-btn.lfav-star { position: absolute; top: 9px; right: 10px; padding: 3px 9px; font-size: 1.1rem; line-height: 1.3; }
  .lfav-toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 10000;
                max-width: 88vw; padding: 10px 16px; border-radius: 12px; background: #222; color: #fff;
                font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
</style>
<script>
(function() {
  var S = window.SmartENT = window.SmartENT || {};
  var favs = {};      // id вопроса → в избранном или нет
  var busy = {};
  function label(on) { return on ? '⭐️ В избранном' : '☆ В избранное'; }
  function paint(root) {
    (root || document).querySelectorAll('[data-fav]').forEach(function(b) {
      var on = !!favs[b.getAttribute('data-fav')];
      b.textContent = label(on);
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  S.favButton = function(qid) {
    return '<button type="button" class="fav-btn" data-fav="' + Number(qid) + '">' + label(!!favs[qid]) + '</button>';
  };
  S.favPaint = paint;
  S.favInit = function(ids) {
    ids = (ids || []).map(Number).filter(Boolean);
    if (!ids.length) return;
    fetch('/learn/api/favorites/state', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                         body: JSON.stringify({ids: ids})})
      .then(function(r) { return r.json(); })
      .then(function(res) { (res.ids || []).forEach(function(i) { favs[i] = true; }); paint(); })
      .catch(function() {});
  };
  // Нажатие на звезду: сразу меняем вид, потом сохраняем; не сохранилось — возвращаем.
  // Снятие звезды посреди занятия текущую сессию не обрывает.
  document.addEventListener('click', function(e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-fav]') : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    var id = b.getAttribute('data-fav');
    if (busy[id]) return;
    busy[id] = true;
    var want = !favs[id];
    favs[id] = want;
    paint();
    fetch('/learn/api/favorites/toggle', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify({question_id: Number(id), on: want})})
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res && res.ok) { favs[id] = !!res.favorite; }
        else { favs[id] = !want; if (S.note) S.note((res && res.error) || 'Не получилось сохранить в избранное.'); }
        paint();
      })
      .catch(function() {
        favs[id] = !want; paint();
        if (S.note) S.note('Нет связи — избранное не сохранилось. Попробуйте ещё раз.');
      })
      .then(function() { busy[id] = false; });
  }, true);

  // ───── ⭐️ Избранные УРОКИ: кнопки с data-lfav="<id урока>" ─────
  var lfavs = {};
  var lbusy = {};
  function lnote(msg) {
    if (S.note) { S.note(msg); return; }
    var t = document.createElement('div');
    t.className = 'lfav-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
  }
  function lpaint() {
    document.querySelectorAll('[data-lfav]').forEach(function(b) {
      var on = !!lfavs[b.getAttribute('data-lfav')];
      b.textContent = b.classList.contains('lfav-star') ? (on ? '⭐️' : '☆') : label(on);
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', on ? 'Убрать урок из избранного' : 'Добавить урок в избранное');
    });
  }
  // Без аргументов берёт id со всех кнопок на странице
  S.lfavInit = function(ids) {
    // Кнопки, которые сервер уже отдал отмеченными (список избранного), горят сразу
    document.querySelectorAll('[data-lfav][data-lfav-on]').forEach(function(b) {
      lfavs[b.getAttribute('data-lfav')] = true;
    });
    lpaint();
    if (!ids) {
      ids = Array.prototype.map.call(document.querySelectorAll('[data-lfav]'),
                                     function(b) { return b.getAttribute('data-lfav'); });
    }
    ids = ids.map(Number).filter(Boolean);
    if (!ids.length) return;
    fetch('/learn/api/favorites/lessons/state', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                  body: JSON.stringify({ids: ids})})
      .then(function(r) { return r.json(); })
      .then(function(res) { (res.ids || []).forEach(function(i) { lfavs[i] = true; }); lpaint(); })
      .catch(function() {});
  };
  document.addEventListener('click', function(e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-lfav]') : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    var id = b.getAttribute('data-lfav');
    if (lbusy[id]) return;
    lbusy[id] = true;
    var want = !lfavs[id];
    lfavs[id] = want;
    lpaint();
    fetch('/learn/api/favorites/lessons/toggle', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                   body: JSON.stringify({lesson_id: Number(id), on: want})})
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res && res.ok) {
          lfavs[id] = !!res.favorite;
          // На странице «Избранные уроки» снятая звезда убирает строку из списка
          var row = b.hasAttribute('data-lfav-remove') ? b.closest('[data-lfav-row]') : null;
          if (row && !res.favorite) {
            row.style.transition = 'opacity .25s';
            row.style.opacity = '0';
            setTimeout(function() {
              if (row.parentNode) row.parentNode.removeChild(row);
              var left = document.querySelectorAll('[data-lfav-row]').length;
              document.querySelectorAll('[data-lfav-count]').forEach(function(c) {
                c.textContent = left ? ' — ' + left : '';
              });
              if (!left) window.location.reload();
            }, 260);
          }
        } else {
          lfavs[id] = !want;
          lnote((res && res.error) || 'Не получилось сохранить в избранное.');
        }
        lpaint();
      })
      .catch(function() {
        lfavs[id] = !want; lpaint();
        lnote('Нет связи, избранное не сохранилось. Попробуйте ещё раз.');
      })
      .then(function() { lbusy[id] = false; });
  }, true);
})();
</script>
