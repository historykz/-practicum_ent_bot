{% extends "base.html" %}
{% block title %}Новый пароль — Smart ENT{% endblock %}
{% block content %}
<section class="admin-card">
  <h1>Новый пароль владельца</h1>
  {% if done %}
  <div class="alert alert-ok">Пароль изменён. Другие сеансы завершены, старый пароль больше не работает.</div>
  {% else %}
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/owner/reset/{{ token }}" class="admin-form" autocomplete="off">
    <label>Новый пароль (не меньше {{ min_len }} символов)</label><input type="password" name="new" required minlength="{{ min_len }}" autocomplete="new-password">
    <label>Повторите пароль</label><input type="password" name="repeat" required minlength="{{ min_len }}" autocomplete="new-password">
    <button class="btn btn-primary" type="submit">Сохранить</button>
  </form>
  {% endif %}
</section>
{% endblock %}
