{% extends "base.html" %}
{% block title %}Live-тест — Smart ENT{% endblock %}
{% block content %}
<div class="live-wrap" id="live-wrap">
  <div class="live-bg"></div>
  <div id="live-root" class="live-root">
    <div class="live-center"><div class="live-spinner"></div><p>Подключаемся…</p></div>
  </div>
</div>

<script>
const CODE = "{{ code }}";
let lastStatus = null, lastQnum = null, answered = false, timerRAF = null, deadline = null;
const root = document.getElementById('live-root');
const COLORS = ['a','b','c','d'];
const SYM = ['▲','◆','●','■'];
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
function haptic(k){try{var h=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;if(h&&h.impactOccurred)h.impactOccurred(k);}catch(_){}}

async function join(){ try{ await fetch(`/api/live/${CODE}/join`,{method:'POST'});}catch(_){}}
async function poll(){
  try{
    const r = await fetch(`/api/live/${CODE}/state`);
    if(!r.ok){ setConn(false); return; }
    setConn(true);
    const d = await r.json();
    render(d);
  }catch(e){ setConn(false); }
}
function setConn(ok){ const el=document.getElementById('live-conn'); if(el) el.className='live-conn '+(ok?'on':'off'); }

function render(d){
  if(d.error==='notfound'){ root.innerHTML='<div class="live-center"><h2>Комната не найдена</h2></div>'; return; }
  if(d.status==='kicked'){ root.innerHTML='<div class="live-center"><h2>Вы исключены из игры</h2></div>'; stopPoll(); return; }

  const key = d.status + ':' + (d.q_num||0);
  if(d.status==='question' && key!==lastQnum){ answered=false; lastQnum=key; renderQuestion(d); startTimer(d); return; }
  if(d.status==='question'){ updateQuestion(d); return; }
  if(key!==lastStatus){ lastStatus=key;
    if(d.status==='lobby') renderLobby(d);
    else if(d.status==='stats') renderStats(d);
    else if(d.status==='finished') renderFinished(d);
  }
}

function topbar(d){
  return `<div class="live-top">
    <span class="live-chip">Вопрос ${d.q_num||'-'}/${d.q_total||'-'}</span>
    <span class="live-chip live-score">⭐ ${d.my_score||0}</span>
    ${d.place?`<span class="live-chip">Место ${d.place}/${d.total_players}</span>`:''}
    <span id="live-conn" class="live-conn on" title="соединение"></span>
  </div>`;
}

function renderLobby(d){
  root.innerHTML = topbar(d) + `<div class="live-center">
    <div class="live-pulse">🎮</div>
    <h2>Вы подключились!</h2>
    <p class="live-sub">Ожидайте начала тестирования…</p>
    <p class="live-sub">Игроков в комнате: <b>${d.total_players||1}</b></p>
  </div>`;
}

function renderQuestion(d){
  const q=d.question;
  root.innerHTML = topbar(d) + `
    <div class="live-qcard">
      ${q.image?`<img src="${q.image}" class="live-qimg" alt="">`:''}
      <div class="live-qtext">${esc(q.text)}</div>
    </div>
    <div class="live-timer"><div class="live-timer-bar" id="live-tbar"></div><span id="live-tsec"></span></div>
    <div class="live-answered" id="live-answered"></div>
    <div class="live-grid${q.options.some(o=>(o.text||'').length>26)?' live-grid-vert':''}" id="live-grid">
      ${q.options.map((o,i)=>`<button class="live-ans live-${COLORS[i%4]}" data-oid="${o.id}">
         <span class="live-sym">${SYM[i%4]}</span><span>${esc(o.text)}</span></button>`).join('')}
    </div>`;
  document.querySelectorAll('.live-ans').forEach(function(b){ b.onclick=function(){ pick(b); }; });
  updateQuestion(d);
}
function updateQuestion(d){
  const el=document.getElementById('live-answered');
  if(el) el.textContent = `Ответили: ${d.answered_count||0}`;
  if(d.answered && !answered){ answered=true; lockAnswers(); }
}
function lockAnswers(){
  document.querySelectorAll('.live-ans').forEach(function(b){ b.disabled=true; });
  const g=document.getElementById('live-grid');
  if(g && !document.getElementById('live-accepted')){
    const p=document.createElement('div'); p.id='live-accepted'; p.className='live-accepted';
    p.textContent='Ответ принят. Ожидайте завершения вопроса'; g.parentNode.insertBefore(p,g.nextSibling);
  }
}
async function pick(btn){
  if(answered) return; answered=true; haptic('medium');
  document.querySelectorAll('.live-ans').forEach(function(b){ b.disabled=true; b.classList.remove('sel'); });
  btn.classList.add('sel');
  try{ await fetch(`/api/live/${CODE}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({option_id:parseInt(btn.getAttribute('data-oid'))})}); }catch(_){}
  lockAnswers();
}

function startTimer(d){
  deadline = Date.now() + (d.remaining||d.time_total||20)*1000;
  const total=(d.time_total||20)*1000;
  function tick(){
    const left=Math.max(0, deadline-Date.now());
    const bar=document.getElementById('live-tbar'), sec=document.getElementById('live-tsec');
    if(bar) bar.style.width=(left/total*100)+'%';
    if(sec) sec.textContent=Math.ceil(left/1000)+'с';
    if(left>0) timerRAF=requestAnimationFrame(tick);
  }
  cancelAnimationFrame(timerRAF); tick();
}

function renderStats(d){
  const s=d.stats||{options:[]};
  const my=d.my_answer;
  let mine='';
  if(my){ mine = my.correct ? `<div class="live-verdict good">✅ Правильно! +${my.points} баллов</div>`
                            : `<div class="live-verdict bad">❌ Неверно</div>`; }
  else { mine = `<div class="live-verdict bad">⏱ Вы не ответили</div>`; }
  root.innerHTML = topbar(d) + mine +
    `<div class="live-statlist">` +
    s.options.map(function(o,i){
      const cls = o.is_correct ? 'correct' : (my&&my.option_id===o.id?'mywrong':'');
      return `<div class="live-statrow live-${COLORS[i%4]} ${cls}">
        <span class="live-sym">${SYM[i%4]}</span>
        <span class="live-stattext">${esc(o.text)} ${o.is_correct?'✔':''}</span>
        <span class="live-statpct">${o.percent}% · ${o.count}</span>
        <div class="live-statfill" style="width:${o.percent}%"></div>
      </div>`;
    }).join('') +
    `</div>
    <p class="live-sub">Не ответили: ${s.not_answered} · Ответили: ${s.answered}/${s.total_players}</p>
    ${d.explanation?`<div class="live-expl">💡 ${esc(d.explanation)}</div>`:''}
    <p class="live-sub">Ожидайте следующий вопрос…</p>`;
}

function renderFinished(d){
  stopPoll();
  const me=d.me_final;
  const pod=d.podium||[];
  const medal=['🥇','🥈','🥉','🏅','🏅'];
  let podium = '<div class="live-podium">' + pod.map(function(p,i){
    return `<div class="live-pod live-pod-${i+1}">
      <div class="live-pod-medal">${medal[i]}</div>
      <div class="live-pod-name">${esc(p.name)}</div>
      <div class="live-pod-score">${p.score} б.</div>
    </div>`;
  }).join('') + '</div>';
  root.innerHTML = `<div class="live-finish">
    <h1 class="live-title">🏆 Итоги</h1>
    ${podium}
    ${me?`<div class="live-mefinal">
      <h3>Ваш результат</h3>
      <div class="live-mestats">
        <div><b>${me.place}</b><span>место из ${me.total}</span></div>
        <div><b>${me.score}</b><span>баллов</span></div>
        <div><b>${me.correct}</b><span>верно</span></div>
        <div><b>${me.percent}%</b><span>результат</span></div>
        <div><b>${me.best_streak}</b><span>серия</span></div>
        <div><b>${me.avg_sec}с</b><span>ср. время</span></div>
      </div>
    </div>`:''}
    <a class="btn btn-primary" href="/learn">📚 К предметам</a>
  </div>`;
  confetti();
}

// лёгкое конфетти без библиотек (GPU-friendly)
function confetti(){
  const c=['#ffd93b','#ff6b6b','#4ecdc4','#a78bfa','#34d399'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div'); p.className='confetti';
    p.style.left=Math.random()*100+'%'; p.style.background=c[i%c.length];
    p.style.animationDelay=(Math.random()*0.6)+'s';
    p.style.transform='rotate('+(Math.random()*360)+'deg)';
    document.getElementById('live-wrap').appendChild(p);
    setTimeout(()=>p.remove(), 4000);
  }
}

let pollTimer=null;
function stopPoll(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }
(async function(){ await join(); await poll(); pollTimer=setInterval(poll, 1200); })();
</script>
{% endblock %}
